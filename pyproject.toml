[project]
name = "fastapi-microservices-platform"
version = "0.1.0"
description = "Platform foundation for the FastAPI Microservices Platform monorepo."
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = { text = "UNLICENSED" }
authors = [{ name = "FastAPI Microservices Platform" }]
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.14,<0.15",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = [
  "services/catalog-service",
  "services/cart-service",
  "services/media-service",
  "services/inventory-service",
  "libs/platform-auth",
  "services/customer-service",
  "services/identity-service",
  "services/reference-service",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "libs/platform-auth/src",
  "services/catalog-service/src",
  "services/cart-service/src",
  "services/media-service/src",
  "services/inventory-service/src",
  "services/reference-service/src",
  "services/identity-service/src",
  "services/customer-service/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = [
  "libs/platform-auth/tests",
  "services/catalog-service/tests",
  "services/cart-service/tests",
  "services/media-service/tests",
  "services/inventory-service/tests",
  "services/reference-service/tests",
  "services/identity-service/tests",
  "services/customer-service/tests",
  "tests",
]
addopts = "-ra --import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
files = [
  "libs/platform-auth/src",
  "services/catalog-service/src",
  "services/cart-service/src",
  "services/media-service/src",
  "services/inventory-service/src",
  "services/reference-service/src",
  "services/identity-service/src",
  "services/customer-service/src",
]
