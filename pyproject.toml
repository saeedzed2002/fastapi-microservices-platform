[project]
name = "fastapi-microservices-platform"
version = "0.1.0"
description = "Platform foundation for the FastAPI Microservices Platform monorepo."
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = { text = "UNLICENSED" }
authors = [{ name = "FastAPI Microservices Platform" }]
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.14,<0.15",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["services/reference-service"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/reference-service/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["services/reference-service/tests", "tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["services/reference-service/src"]
