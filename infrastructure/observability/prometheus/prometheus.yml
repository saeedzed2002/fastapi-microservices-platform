global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: platform-apis
    metrics_path: /metrics
    static_configs:
      - targets:
          - reference-service:8000
          - identity-service:8000
          - customer-service:8000
          - catalog-service:8000
          - search-service:8000
          - media-service:8000
          - inventory-service:8000
          - cart-service:8000
          - order-service:8000
          - payment-service:8000
          - notification-service:8000
          - chat-service:8000
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
