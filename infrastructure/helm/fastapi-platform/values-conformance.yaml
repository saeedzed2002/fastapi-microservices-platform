api:
  # The disposable Kind proof has one node. Production delivery keeps the
  # default of two replicas per API; this isolated override preserves the
  # previously proven one-replica resource envelope.
  replicas: 1

autoscaling:
  # Keep the one-node Kind harness bounded while still proving every HPA can
  # obtain a CPU metric from the disposable metrics-server installation.
  minReplicas: 1
  maxReplicas: 1

# The disposable Kind proof has one schedulable node and now verifies the full
# API-plus-worker topology.  These are scheduler requests only: Helm merges
# the production limits from values.yaml, and no production capacity policy is
# changed by this test harness.
apiServices:
  reference-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  identity-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  customer-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  catalog-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  search-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  media-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  inventory-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  cart-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  order-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  payment-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  shipping-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  notification-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}
  chat-service: {resources: {requests: {cpu: 50m, memory: 128Mi}}}

workers:
  order-invoice-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  notification-email-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  notification-sms-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  media-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  payment-expiry-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  identity-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  customer-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  catalog-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  search-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  inventory-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  order-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  payment-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  shipping-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  media-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}
  notification-event-worker: {resources: {requests: {cpu: 25m, memory: 128Mi}}}

images:
  repositoryPrefix: fastapi-platform
  pullPolicy: Never
  allowMutableTags: true
  pullSecrets: []
  services:
    reference-service: {tag: conformance}
    identity-service: {tag: conformance}
    customer-service: {tag: conformance}
    catalog-service: {tag: conformance}
    search-service: {tag: conformance}
    media-service: {tag: conformance}
    inventory-service: {tag: conformance}
    cart-service: {tag: conformance}
    order-service: {tag: conformance}
    payment-service: {tag: conformance}
    shipping-service: {tag: conformance}
    notification-service: {tag: conformance}
    chat-service: {tag: conformance}
