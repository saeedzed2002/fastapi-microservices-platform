api:
  # The disposable Kind proof has one node. Production delivery keeps the
  # default of two replicas per API; this isolated override preserves the
  # previously proven one-replica resource envelope.
  replicas: 1

autoscaling:
  # Keep the one-node Kind harness bounded while still proving every HPA can
  # obtain a CPU metric from the disposable metrics-server installation.
  minReplicas: 1
  maxReplicas: 1

images:
  repositoryPrefix: fastapi-platform
  pullPolicy: Never
  allowMutableTags: true
  pullSecrets: []
  services:
    reference-service: {tag: conformance}
    identity-service: {tag: conformance}
    customer-service: {tag: conformance}
    catalog-service: {tag: conformance}
    search-service: {tag: conformance}
    media-service: {tag: conformance}
    inventory-service: {tag: conformance}
    cart-service: {tag: conformance}
    order-service: {tag: conformance}
    payment-service: {tag: conformance}
    notification-service: {tag: conformance}
    chat-service: {tag: conformance}
