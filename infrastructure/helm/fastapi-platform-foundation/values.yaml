# This chart is installed with `--create-namespace`. It deliberately does not
# create a Namespace object because Helm stores its release metadata there
# before it can apply chart resources.
serviceAccount:
  name: platform-runtime

runtimeConfig:
  PLATFORM_ENVIRONMENT: production
  PLATFORM_OBSERVABILITY_ENABLED: "false"
  PLATFORM_OTLP_GRPC_ENDPOINT: 127.0.0.1:4317
  PLATFORM_LOG_LEVEL: INFO
  IDENTITY_ENVIRONMENT: production
  CUSTOMER_ENVIRONMENT: production
  CATALOG_ENVIRONMENT: production
  SEARCH_ENVIRONMENT: production
  MEDIA_ENVIRONMENT: production
  INVENTORY_ENVIRONMENT: production
  CART_ENVIRONMENT: production
  ORDER_ENVIRONMENT: production
  PAYMENT_ENVIRONMENT: production
  NOTIFICATION_ENVIRONMENT: production
  CHAT_ENVIRONMENT: production
  IDENTITY_JWT_ISSUER: fastapi-platform.identity
  IDENTITY_JWT_AUDIENCE: fastapi-platform
  IDENTITY_KAFKA_PUBLISHER_ENABLED: "false"
  IDENTITY_OTP_NOTIFICATION_BASE_URL: "http://notification-service.{{ .Release.Namespace }}.svc.cluster.local"
  CUSTOMER_JWT_ISSUER: fastapi-platform.identity
  CUSTOMER_JWT_AUDIENCE: fastapi-platform
  CUSTOMER_KAFKA_CONSUMER_ENABLED: "false"
  CATALOG_JWT_ISSUER: fastapi-platform.identity
  CATALOG_JWT_AUDIENCE: fastapi-platform
  CATALOG_KAFKA_PUBLISHER_ENABLED: "false"
  CATALOG_MEDIA_BASE_URL: "http://media-service.{{ .Release.Namespace }}.svc.cluster.local"
  SEARCH_KAFKA_CONSUMER_ENABLED: "false"
  MEDIA_JWT_ISSUER: fastapi-platform.identity
  MEDIA_JWT_AUDIENCE: fastapi-platform
  MEDIA_TASK_DISPATCHER_ENABLED: "false"
  MEDIA_KAFKA_PUBLISHER_ENABLED: "false"
  MEDIA_CATALOG_BASE_URL: "http://catalog-service.{{ .Release.Namespace }}.svc.cluster.local"
  MEDIA_S3_BUCKET: fastapi-platform-media
  MEDIA_S3_REGION: us-east-1
  MEDIA_ABANDONED_UPLOAD_CLEANUP_ENABLED: "true"
  MEDIA_ABANDONED_UPLOAD_RETENTION_SECONDS: "86400"
  MEDIA_ABANDONED_UPLOAD_REAP_INTERVAL_SECONDS: "3600"
  INVENTORY_JWT_ISSUER: fastapi-platform.identity
  INVENTORY_JWT_AUDIENCE: fastapi-platform
  INVENTORY_ORDER_BASE_URL: "http://order-service.{{ .Release.Namespace }}.svc.cluster.local"
  INVENTORY_KAFKA_PUBLISHER_ENABLED: "false"
  INVENTORY_KAFKA_CONSUMER_ENABLED: "false"
  CART_JWT_ISSUER: fastapi-platform.identity
  CART_JWT_AUDIENCE: fastapi-platform
  ORDER_JWT_ISSUER: fastapi-platform.identity
  ORDER_JWT_AUDIENCE: fastapi-platform
  ORDER_CATALOG_BASE_URL: "http://catalog-service.{{ .Release.Namespace }}.svc.cluster.local"
  ORDER_CUSTOMER_BASE_URL: "http://customer-service.{{ .Release.Namespace }}.svc.cluster.local"
  ORDER_CART_BASE_URL: "http://cart-service.{{ .Release.Namespace }}.svc.cluster.local"
  ORDER_PAYMENT_BASE_URL: "http://payment-service.{{ .Release.Namespace }}.svc.cluster.local"
  ORDER_SHIPPING_BASE_URL: "http://shipping-service.{{ .Release.Namespace }}.svc.cluster.local"
  ORDER_KAFKA_PUBLISHER_ENABLED: "false"
  ORDER_KAFKA_CONSUMER_ENABLED: "false"
  ORDER_INVOICE_CONSUMER_ENABLED: "false"
  ORDER_SHIPPING_CONSUMER_ENABLED: "false"
  ORDER_TASK_DISPATCHER_ENABLED: "false"
  ORDER_S3_BUCKET: fastapi-platform-invoices
  ORDER_S3_REGION: us-east-1
  PAYMENT_JWT_ISSUER: fastapi-platform.identity
  PAYMENT_JWT_AUDIENCE: fastapi-platform
  PAYMENT_ORDER_BASE_URL: "http://order-service.{{ .Release.Namespace }}.svc.cluster.local"
  PAYMENT_KAFKA_PUBLISHER_ENABLED: "false"
  PAYMENT_KAFKA_CONSUMER_ENABLED: "false"
  PAYMENT_EXPIRY_WORKER_ENABLED: "false"
  PAYMENT_ZARINPAL_SANDBOX: "false"
  PAYMENT_ZARINPAL_CALLBACK_URL: https://replace-with-public-origin.example/api/v1/payments/zarinpal/callback
  PAYMENT_ZIBAL_CALLBACK_URL: https://replace-with-public-origin.example/api/v1/payments/zibal/callback
  SHIPPING_ENVIRONMENT: production
  SHIPPING_JWT_ISSUER: fastapi-platform.identity
  SHIPPING_JWT_AUDIENCE: fastapi-platform
  SHIPPING_ORDER_BASE_URL: "http://order-service.{{ .Release.Namespace }}.svc.cluster.local"
  SHIPPING_KAFKA_CONSUMER_ENABLED: "false"
  SHIPPING_KAFKA_PUBLISHER_ENABLED: "false"
  NOTIFICATION_KAFKA_CONSUMER_ENABLED: "false"
  NOTIFICATION_TASK_DISPATCHER_ENABLED: "false"
  NOTIFICATION_IDENTITY_OTP_BASE_URL: "http://identity-service.{{ .Release.Namespace }}.svc.cluster.local"
  NOTIFICATION_SMTP_PORT: "587"
  NOTIFICATION_SMTP_FROM_EMAIL: no-reply@replace-with-public-host.example
  NOTIFICATION_SMSIR_ENABLED: "false"
  CHAT_JWT_ISSUER: fastapi-platform.identity
  CHAT_JWT_AUDIENCE: fastapi-platform
  CHAT_MEDIA_BASE_URL: "http://media-service.{{ .Release.Namespace }}.svc.cluster.local"

resourcePolicy:
  limitRange:
    defaultRequest:
      cpu: 50m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
  quota:
    pods: "90"
    requestsCpu: "12"
    requestsMemory: 24Gi
    limitsCpu: "84"
    limitsMemory: 48Gi

networkPolicy:
  ingressNamespaceLabel: platform.fastapi.io/allow-ingress
