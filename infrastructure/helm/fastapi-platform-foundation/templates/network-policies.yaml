apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastapi-platform-foundation.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-api-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fastapi-platform-foundation.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      platform.fastapi.io/workload: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: fastapi-microservices-platform
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.ingressNamespaceLabel }}: "true"
      ports:
        - protocol: TCP
          port: 8000
