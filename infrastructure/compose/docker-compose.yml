name: fastapi-microservices-platform

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform-local-only
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.2.0
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: platform-local-only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:8.10.0
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-local
      MINIO_ROOT_PASSWORD: minio-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 10s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  reference-service:
    build:
      context: ../..
      dockerfile: services/reference-service/Dockerfile
    environment:
      PLATFORM_ENVIRONMENT: local
      PLATFORM_LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  identity-service:
    build:
      context: ../..
      dockerfile: services/identity-service/Dockerfile
    environment:
      IDENTITY_ENVIRONMENT: local
      IDENTITY_DATABASE_URL: postgresql+asyncpg://identity_service:identity-local-only@postgres:5432/identity_service
      IDENTITY_JWT_SECRET: local-development-jwt-secret-change-me-32-bytes
      IDENTITY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IDENTITY_KAFKA_PUBLISHER_ENABLED: "true"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  customer-service:
    build:
      context: ../..
      dockerfile: services/customer-service/Dockerfile
    environment:
      CUSTOMER_ENVIRONMENT: local
      CUSTOMER_DATABASE_URL: postgresql+asyncpg://customer_service:customer-local-only@postgres:5432/customer_service
      CUSTOMER_JWT_SECRET: local-development-jwt-secret-change-me-32-bytes
      CUSTOMER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CUSTOMER_KAFKA_CONSUMER_ENABLED: "true"
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog-service:
    build:
      context: ../..
      dockerfile: services/catalog-service/Dockerfile
    environment:
      CATALOG_ENVIRONMENT: local
      CATALOG_DATABASE_URL: postgresql+asyncpg://catalog_service:catalog-local-only@postgres:5432/catalog_service
      CATALOG_JWT_SECRET: local-development-jwt-secret-change-me-32-bytes
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  media-service:
    build:
      context: ../..
      dockerfile: services/media-service/Dockerfile
    image: fastapi-microservices-platform-media-service:0.6.1-local
    environment:
      MEDIA_ENVIRONMENT: local
      MEDIA_DATABASE_URL: postgresql+asyncpg://media_service:media-local-only@postgres:5432/media_service
      MEDIA_JWT_SECRET: local-development-jwt-secret-change-me-32-bytes
      MEDIA_S3_ENDPOINT_URL: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      MEDIA_RABBITMQ_URL: amqp://platform:platform-local-only@rabbitmq:5672//
      MEDIA_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MEDIA_TASK_DISPATCHER_ENABLED: "true"
      MEDIA_KAFKA_PUBLISHER_ENABLED: "true"
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  inventory-service:
    build:
      context: ../..
      dockerfile: services/inventory-service/Dockerfile
    environment:
      INVENTORY_ENVIRONMENT: local
      INVENTORY_DATABASE_URL: postgresql+asyncpg://inventory_service:inventory-local-only@postgres:5432/inventory_service
      INVENTORY_JWT_SECRET: local-development-jwt-secret-change-me-32-bytes
      INVENTORY_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_KAFKA_PUBLISHER_ENABLED: "true"
      INVENTORY_KAFKA_CONSUMER_ENABLED: "true"
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  cart-service:
    build:
      context: ../..
      dockerfile: services/cart-service/Dockerfile
    environment:
      CART_ENVIRONMENT: local
      CART_DATABASE_URL: postgresql+asyncpg://cart_service:cart-local-only@postgres:5432/cart_service
      CART_JWT_SECRET: local-development-jwt-secret-change-me-32-bytes
      CART_REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  order-service:
    build:
      context: ../..
      dockerfile: services/order-service/Dockerfile
    image: fastapi-microservices-platform-order-service:0.6.1-local
    environment:
      ORDER_ENVIRONMENT: local
      ORDER_DATABASE_URL: postgresql+asyncpg://order_service:order-local-only@postgres:5432/order_service
      ORDER_JWT_SECRET: local-development-jwt-secret-change-me-32-bytes
      ORDER_CATALOG_BASE_URL: http://catalog-service:8000
      ORDER_CUSTOMER_BASE_URL: http://customer-service:8000
      ORDER_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_KAFKA_PUBLISHER_ENABLED: "true"
      ORDER_KAFKA_CONSUMER_ENABLED: "true"
      ORDER_INVOICE_CONSUMER_ENABLED: "true"
      ORDER_TASK_DISPATCHER_ENABLED: "true"
      ORDER_RABBITMQ_URL: amqp://platform:platform-local-only@rabbitmq:5672//
      ORDER_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "127.0.0.1:8007:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  payment-service:
    build:
      context: ../..
      dockerfile: services/payment-service/Dockerfile
    environment:
      PAYMENT_ENVIRONMENT: local
      PAYMENT_DATABASE_URL: postgresql+asyncpg://payment_service:payment-local-only@postgres:5432/payment_service
      PAYMENT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_KAFKA_PUBLISHER_ENABLED: "true"
      PAYMENT_KAFKA_CONSUMER_ENABLED: "true"
    ports:
      - "127.0.0.1:8008:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-service:
    build:
      context: ../..
      dockerfile: services/notification-service/Dockerfile
    image: fastapi-microservices-platform-notification-service:0.6.1-local
    environment:
      NOTIFICATION_ENVIRONMENT: local
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://notification_service:notification-local-only@postgres:5432/notification_service
      NOTIFICATION_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_KAFKA_CONSUMER_ENABLED: "true"
      NOTIFICATION_RABBITMQ_URL: amqp://platform:platform-local-only@rabbitmq:5672//
      NOTIFICATION_TASK_DISPATCHER_ENABLED: "true"
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:8009:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12

  order-invoice-worker:
    image: fastapi-microservices-platform-order-service:0.6.1-local
    pull_policy: never
    command: ["celery", "-A", "order_service.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--without-mingle", "--without-gossip", "-Q", "order.invoice"]
    environment:
      ORDER_ENVIRONMENT: local
      ORDER_DATABASE_URL: postgresql+asyncpg://order_service:order-local-only@postgres:5432/order_service
      ORDER_RABBITMQ_URL: amqp://platform:platform-local-only@rabbitmq:5672//
      ORDER_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  notification-worker:
    image: fastapi-microservices-platform-notification-service:0.6.1-local
    pull_policy: never
    command: ["celery", "-A", "notification_service.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--without-mingle", "--without-gossip", "-Q", "notification.email"]
    environment:
      NOTIFICATION_ENVIRONMENT: local
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://notification_service:notification-local-only@postgres:5432/notification_service
      NOTIFICATION_RABBITMQ_URL: amqp://platform:platform-local-only@rabbitmq:5672//
      NOTIFICATION_SMTP_HOST: mailpit
      NOTIFICATION_SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  media-worker:
    image: fastapi-microservices-platform-media-service:0.6.1-local
    pull_policy: never
    command: ["celery", "-A", "media_service.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--without-mingle", "--without-gossip"]
    environment:
      MEDIA_ENVIRONMENT: local
      MEDIA_DATABASE_URL: postgresql+asyncpg://media_service:media-local-only@postgres:5432/media_service
      MEDIA_S3_ENDPOINT_URL: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      MEDIA_RABBITMQ_URL: amqp://platform:platform-local-only@rabbitmq:5672//
      MEDIA_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
