apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: fastapi-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-platform-api-ingress
  namespace: fastapi-platform
spec:
  podSelector:
    matchLabels:
      platform.fastapi.io/workload: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: fastapi-microservices-platform
        - namespaceSelector:
            matchLabels:
              platform.fastapi.io/allow-ingress: "true"
      ports:
        - protocol: TCP
          port: 8000
