apiVersion: v1
kind: LimitRange
metadata:
  name: platform-container-defaults
  namespace: fastapi-platform
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform-workload-budget
  namespace: fastapi-platform
spec:
  hard:
    # Covers all API HPA targets at their four-replica ceiling, a one-Pod
    # rolling-update surge per API, and the separately owned worker/migration
    # workloads. Cluster capacity remains the scheduler's responsibility.
    pods: "75"
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "72"
    limits.memory: 36Gi
