# Disposable infrastructure for the Kind conformance test. It is deliberately
# isolated from the restricted application namespace and never represents a
# production stateful-services topology.
apiVersion: v1
kind: Namespace
metadata:
  name: fastapi-platform-dependencies
  labels:
    app.kubernetes.io/part-of: fastapi-microservices-platform
    platform.fastapi.io/conformance: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-bootstrap
  namespace: fastapi-platform-dependencies
data:
  001-services.sql: |
    CREATE USER identity_service WITH PASSWORD 'identity-conformance-only';
    CREATE DATABASE identity_service OWNER identity_service;
    CREATE USER customer_service WITH PASSWORD 'customer-conformance-only';
    CREATE DATABASE customer_service OWNER customer_service;
    CREATE USER catalog_service WITH PASSWORD 'catalog-conformance-only';
    CREATE DATABASE catalog_service OWNER catalog_service;
    CREATE USER search_service WITH PASSWORD 'search-conformance-only';
    CREATE DATABASE search_service OWNER search_service;
    CREATE USER media_service WITH PASSWORD 'media-conformance-only';
    CREATE DATABASE media_service OWNER media_service;
    CREATE USER inventory_service WITH PASSWORD 'inventory-conformance-only';
    CREATE DATABASE inventory_service OWNER inventory_service;
    CREATE USER cart_service WITH PASSWORD 'cart-conformance-only';
    CREATE DATABASE cart_service OWNER cart_service;
    CREATE USER order_service WITH PASSWORD 'order-conformance-only';
    CREATE DATABASE order_service OWNER order_service;
    CREATE USER payment_service WITH PASSWORD 'payment-conformance-only';
    CREATE DATABASE payment_service OWNER payment_service;
    CREATE USER notification_service WITH PASSWORD 'notification-conformance-only';
    CREATE DATABASE notification_service OWNER notification_service;
    CREATE USER chat_service WITH PASSWORD 'chat-conformance-only';
    CREATE DATABASE chat_service OWNER chat_service;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fastapi-platform-dependencies
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: fastapi-microservices-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: fastapi-microservices-platform}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6@sha256:1957b2ff3137e4ef7f3bc813e74fff50b1e1ffddc85c8b9d6f14ade972be8687
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: platform}
            - {name: POSTGRES_PASSWORD, value: platform-conformance-only}
            - {name: POSTGRES_DB, value: platform}
          readinessProbe:
            exec: {command: [sh, -c, pg_isready -U platform -d platform]}
            periodSeconds: 3
            failureThreshold: 20
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: bootstrap, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: bootstrap, configMap: {name: postgres-bootstrap}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fastapi-platform-dependencies
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: fastapi-platform-dependencies
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: fastapi-microservices-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kafka}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: fastapi-microservices-platform}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.2.0@sha256:9516fb7634bad307d17c33b589fde9023003b0cb761374f500002b980a3149b9
          ports: [{name: kafka, containerPort: 9092}]
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_LISTENERS, value: "CONTROLLER://:29093,PLAINTEXT://:9092"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.fastapi-platform-dependencies.svc.cluster.local:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:29093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "3"}
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
          readinessProbe:
            exec: {command: [sh, -c, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null]}
            periodSeconds: 5
            failureThreshold: 24
          resources: {requests: {cpu: 250m, memory: 768Mi}, limits: {cpu: "1", memory: 1536Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: fastapi-platform-dependencies
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports: [{name: kafka, port: 9092, targetPort: kafka}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: fastapi-platform-dependencies
  labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: fastapi-microservices-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rabbitmq}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: fastapi-microservices-platform}
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management@sha256:06fb591136a49e861e01aaaf9ce45085839ca23c35913d45a1e83519bb9778ca
          ports: [{name: amqp, containerPort: 5672}]
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: platform}
            - {name: RABBITMQ_DEFAULT_PASS, value: platform-conformance-only}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            periodSeconds: 5
            failureThreshold: 24
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 768Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: fastapi-platform-dependencies
spec:
  selector: {app.kubernetes.io/name: rabbitmq}
  ports: [{name: amqp, port: 5672, targetPort: amqp}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: fastapi-platform-dependencies
  labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: fastapi-microservices-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: redis}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: redis, app.kubernetes.io/part-of: fastapi-microservices-platform}
    spec:
      containers:
        - name: redis
          image: redis:8.10.0@sha256:344e3945a0b431c8ff1eecd58c5573538126bd756f02fc7e218ddf1fc2546366
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 3
            failureThreshold: 20
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fastapi-platform-dependencies
spec:
  selector: {app.kubernetes.io/name: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: fastapi-platform-dependencies
  labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: fastapi-microservices-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: minio}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio, app.kubernetes.io/part-of: fastapi-microservices-platform}
    spec:
      containers:
        - name: minio
          image: fastapi-platform/minio:conformance
          imagePullPolicy: Never
          command: [minio, server, /data]
          ports: [{name: s3, containerPort: 9000}]
          env:
            - {name: MINIO_ROOT_USER, value: minio-conformance}
            - {name: MINIO_ROOT_PASSWORD, value: minio-conformance-only-secret}
          readinessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            periodSeconds: 3
            failureThreshold: 20
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: fastapi-platform-dependencies
spec:
  selector: {app.kubernetes.io/name: minio}
  ports: [{name: s3, port: 9000, targetPort: s3}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: fastapi-platform-dependencies
  labels: {app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: fastapi-microservices-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: mailpit}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: fastapi-microservices-platform}
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: http, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            failureThreshold: 20
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: fastapi-platform-dependencies
spec:
  selector: {app.kubernetes.io/name: mailpit}
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: http, port: 8025, targetPort: http}
