# API autoscaling is intentionally CPU-based and bounded. Every target has an
# explicit CPU request in api-workloads.yaml, which is required for utilization
# metrics. Queue workers use a different scaling concern and are excluded.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reference-service
  namespace: fastapi-platform
  labels: {app.kubernetes.io/name: reference-service, app.kubernetes.io/part-of: fastapi-microservices-platform}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: reference-service}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies: [{type: Pods, value: 2, periodSeconds: 60}, {type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
---
