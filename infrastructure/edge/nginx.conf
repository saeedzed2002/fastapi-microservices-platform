worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format edge_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","request":"$request","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout edge_json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65s;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=edge_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=edge_sensitive:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=edge_upload:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=edge_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        location = /health/live {
            default_type text/plain;
            return 200 'ok';
        }

        location = /health/ready {
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            return 308 https://localhost:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 12m;
        limit_conn edge_connections 40;
        limit_req zone=edge_general burst=60 nodelay;

        location = /health/live {
            default_type text/plain;
            return 200 'ok';
        }

        location = /health/ready {
            default_type text/plain;
            return 200 'ok';
        }

        location = /api/v1/auth/login {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/auth/otp/ {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/auth/password-reset/ {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/auth/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/customers/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://customer-service:8000;
        }

        location ^~ /api/v1/catalog/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://catalog-service:8000;
        }

        location = /api/v1/media/uploads {
            limit_req zone=edge_upload burst=10 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://media-service:8000;
        }

        location ^~ /api/v1/media/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://media-service:8000;
        }

        location ^~ /api/v1/inventory/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://inventory-service:8000;
        }

        location ^~ /api/v1/carts/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://cart-service:8000;
        }

        location ^~ /api/v1/orders/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://order-service:8000;
        }

        location = /api/v1/chat/ws {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
            proxy_pass http://chat-service:8000;
        }

        location ^~ /api/v1/chat/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://chat-service:8000;
        }

        location = /api/v1/reference {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://reference-service:8000;
        }

        location ^~ /api/internal/ {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
