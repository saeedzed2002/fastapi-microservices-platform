worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format edge_json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request_id":"$request_id","request":"$request","status":$status,'
        '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';
    access_log /dev/stdout edge_json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65s;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    limit_req_zone $binary_remote_addr zone=edge_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=edge_sensitive:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=edge_upload:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=edge_connections:10m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        location = /health/live {
            default_type text/plain;
            return 200 'ok';
        }

        location = /health/ready {
            default_type text/plain;
            return 200 'ok';
        }

        location / {
            return 308 https://localhost$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 12m;
        limit_conn edge_connections 40;
        limit_req zone=edge_general burst=60 nodelay;

        location = /health/live {
            default_type text/plain;
            return 200 'ok';
        }

        location = /health/ready {
            default_type text/plain;
            return 200 'ok';
        }

        location = / {
            default_type application/json;
            return 200 '{"status":"ok","api_base":"/api/v1"}\n';
        }

        location = /docs {
            return 308 /docs/;
        }

        location = /docs/ {
            root /etc/nginx/edge;
            try_files /docs-index.html =404;
        }

        location = /docs/reference {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/reference/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/reference/oauth2-redirect'";
            proxy_pass http://reference-service:8000/docs;
        }

        location = /docs/reference/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://reference-service:8000/openapi.json;
        }

        location = /docs/reference/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://reference-service:8000/docs/oauth2-redirect;
        }

        location = /docs/identity {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/identity/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/identity/oauth2-redirect'";
            proxy_pass http://identity-service:8000/docs;
        }

        location = /docs/identity/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000/openapi.json;
        }

        location = /docs/identity/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000/docs/oauth2-redirect;
        }

        location = /docs/customer {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/customer/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/customer/oauth2-redirect'";
            proxy_pass http://customer-service:8000/docs;
        }

        location = /docs/customer/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://customer-service:8000/openapi.json;
        }

        location = /docs/customer/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://customer-service:8000/docs/oauth2-redirect;
        }

        location = /docs/catalog {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/catalog/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/catalog/oauth2-redirect'";
            proxy_pass http://catalog-service:8000/docs;
        }

        location = /docs/catalog/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://catalog-service:8000/openapi.json;
        }

        location = /docs/catalog/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://catalog-service:8000/docs/oauth2-redirect;
        }

        location = /docs/media {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/media/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/media/oauth2-redirect'";
            proxy_pass http://media-service:8000/docs;
        }

        location = /docs/media/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://media-service:8000/openapi.json;
        }

        location = /docs/media/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://media-service:8000/docs/oauth2-redirect;
        }

        location = /docs/inventory {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/inventory/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/inventory/oauth2-redirect'";
            proxy_pass http://inventory-service:8000/docs;
        }

        location = /docs/inventory/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://inventory-service:8000/openapi.json;
        }

        location = /docs/inventory/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://inventory-service:8000/docs/oauth2-redirect;
        }

        location = /docs/cart {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/cart/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/cart/oauth2-redirect'";
            proxy_pass http://cart-service:8000/docs;
        }

        location = /docs/cart/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://cart-service:8000/openapi.json;
        }

        location = /docs/cart/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://cart-service:8000/docs/oauth2-redirect;
        }

        location = /docs/order {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/order/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/order/oauth2-redirect'";
            proxy_pass http://order-service:8000/docs;
        }

        location = /docs/order/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://order-service:8000/openapi.json;
        }

        location = /docs/order/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://order-service:8000/docs/oauth2-redirect;
        }

        location = /docs/payment {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/payment/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/payment/oauth2-redirect'";
            proxy_pass http://payment-service:8000/docs;
        }

        location = /docs/payment/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://payment-service:8000/openapi.json;
        }

        location = /docs/payment/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://payment-service:8000/docs/oauth2-redirect;
        }

        location = /docs/notification {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/notification/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/notification/oauth2-redirect'";
            proxy_pass http://notification-service:8000/docs;
        }

        location = /docs/notification/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://notification-service:8000/openapi.json;
        }

        location = /docs/notification/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://notification-service:8000/docs/oauth2-redirect;
        }

        location = /docs/chat {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Accept-Encoding "";
            sub_filter "url: '/openapi.json'" "url: '/docs/chat/openapi.json'";
            sub_filter "window.location.origin + '/docs/oauth2-redirect'" "window.location.origin + '/docs/chat/oauth2-redirect'";
            proxy_pass http://chat-service:8000/docs;
        }

        location = /docs/chat/openapi.json {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://chat-service:8000/openapi.json;
        }

        location = /docs/chat/oauth2-redirect {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://chat-service:8000/docs/oauth2-redirect;
        }

        location = /api/v1/auth/login {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/auth/otp/ {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/auth/password-reset/ {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/auth/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://identity-service:8000;
        }

        location ^~ /api/v1/customers/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://customer-service:8000;
        }

        location ^~ /api/v1/catalog/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://catalog-service:8000;
        }

        location = /api/v1/media/uploads {
            limit_req zone=edge_upload burst=10 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://media-service:8000;
        }

        location ^~ /api/v1/media/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://media-service:8000;
        }

        location ^~ /api/v1/inventory/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://inventory-service:8000;
        }

        location ^~ /api/v1/carts/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://cart-service:8000;
        }

        location = /api/v1/orders {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://order-service:8000;
        }

        location ^~ /api/v1/orders/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://order-service:8000;
        }

        location = /api/v1/chat/ws {
            limit_req zone=edge_sensitive burst=5 nodelay;
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_buffering off;
            proxy_pass http://chat-service:8000;
        }

        location ^~ /api/v1/chat/ {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://chat-service:8000;
        }

        location = /api/v1/reference {
            include /etc/nginx/edge/proxy-headers.conf;
            proxy_pass http://reference-service:8000;
        }

        location ^~ /api/internal/ {
            return 404;
        }

        location / {
            return 404;
        }
    }
}
