[project]
name = "platform-auth"
version = "0.1.0"
description = "Technical JWT verification utilities shared without domain models."
requires-python = ">=3.12,<3.15"
dependencies = ["PyJWT[crypto]>=2.13,<3"]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv]
package = true
