[project]
name = "platform-messaging"
version = "0.1.0"
description = "Technical Kafka delivery and dead-letter utilities shared without domain models."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiokafka>=0.14,<0.15",
  "platform-observability",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
platform-observability = { workspace = true }
