[project]
name = "platform-observability"
version = "0.1.0"
description = "Cross-cutting telemetry primitives with no business-domain semantics."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "opentelemetry-api>=1.44,<1.45",
  "opentelemetry-exporter-otlp-proto-grpc>=1.44,<1.45",
  "opentelemetry-sdk>=1.44,<1.45",
  "prometheus-client>=0.26,<0.27",
  "sqlalchemy>=2.0,<2.1",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv]
package = true
