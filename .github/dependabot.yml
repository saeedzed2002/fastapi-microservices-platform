version: 2
# Routine version updates stay enabled for public-repository maintenance, but
# each ecosystem proposes one small review at a time. Dependabot security
# updates remain enabled separately and are not subject to this limit.
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: docker-compose
    directory: "/infrastructure/compose"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directories:
      - "/services/catalog-service"
      - "/services/cart-service"
      - "/services/customer-service"
      - "/services/identity-service"
      - "/services/inventory-service"
      - "/services/media-service"
      - "/services/notification-service"
      - "/services/order-service"
      - "/services/payment-service"
      - "/services/reference-service"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
