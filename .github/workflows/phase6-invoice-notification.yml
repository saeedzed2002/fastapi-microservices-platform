name: Phase 6 Invoice and Notification Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-invoice-notification:
    name: Validate invoice delivery foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Sync locked workspace
        run: uv sync --locked --all-packages

      - name: Lint, format, type check, and tests
        run: |
          uv run --all-packages ruff check .
          uv run --all-packages ruff format --check .
          uv run --all-packages mypy
          uv run --all-packages pytest

      - name: Validate architecture, contracts, and Compose
        shell: pwsh
        run: |
          ./scripts/validate_phase0.ps1
          docker compose -f infrastructure/compose/docker-compose.yml config

      - name: Build invoice and notification images
        run: |
          docker build --file services/media-service/Dockerfile --tag media-service:ci .
          docker build --file services/order-service/Dockerfile --tag order-service:ci .
          docker build --file services/notification-service/Dockerfile --tag notification-service:ci .

      - name: Run checkout, invoice, and notification integration test
        run: |
          docker compose -f infrastructure/compose/docker-compose.yml up -d --build --wait
          uv run --package identity-service alembic -c services/identity-service/alembic.ini upgrade head
          uv run --package customer-service alembic -c services/customer-service/alembic.ini upgrade head
          uv run --package catalog-service alembic -c services/catalog-service/alembic.ini upgrade head
          uv run --package media-service alembic -c services/media-service/alembic.ini upgrade head
          uv run --package inventory-service alembic -c services/inventory-service/alembic.ini upgrade head
          uv run --package cart-service alembic -c services/cart-service/alembic.ini upgrade head
          uv run --package order-service alembic -c services/order-service/alembic.ini upgrade head
          uv run --package payment-service alembic -c services/payment-service/alembic.ini upgrade head
          uv run --package notification-service alembic -c services/notification-service/alembic.ini upgrade head
          RUN_E2E=1 E2E_BASE_URL=http://127.0.0.1 uv run --all-packages pytest tests/e2e/test_phase6_checkout_notification.py -q

      - name: Collect logs on failure
        if: failure()
        run: docker compose -f infrastructure/compose/docker-compose.yml logs --no-color

      - name: Stop integration platform
        if: always()
        run: docker compose -f infrastructure/compose/docker-compose.yml down --volumes --remove-orphans
