name: Phase 2 Identity and Customer Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-identity-customer:
    name: Validate identity and customer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Sync locked workspace
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run --all-packages ruff check .

      - name: Format check
        run: uv run --all-packages ruff format --check .

      - name: Type check
        run: uv run --all-packages mypy

      - name: Tests
        run: uv run --all-packages pytest

      - name: Validate contracts and Compose
        shell: pwsh
        run: |
          ./scripts/validate_phase0.ps1
          docker compose -f infrastructure/compose/docker-compose.yml config

      - name: Build identity service image
        run: docker build --file services/identity-service/Dockerfile --tag identity-service:ci .

      - name: Build customer service image
        run: docker build --file services/customer-service/Dockerfile --tag customer-service:ci .
