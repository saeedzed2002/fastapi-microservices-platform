name: Phase 5 Order and Payment Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-order-payment:
    name: Validate checkout Saga
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Sync locked workspace
        run: uv sync --locked --all-packages

      - name: Lint, format, type check, and tests
        run: |
          uv run --all-packages ruff check .
          uv run --all-packages ruff format --check .
          uv run --all-packages mypy
          uv run --all-packages pytest

      - name: Validate contracts and Compose
        shell: pwsh
        run: |
          ./scripts/validate_phase0.ps1
          docker compose -f infrastructure/compose/docker-compose.yml config

      - name: Build checkout Saga images
        run: |
          docker build --file services/inventory-service/Dockerfile --tag inventory-service:ci .
          docker build --file services/order-service/Dockerfile --tag order-service:ci .
          docker build --file services/payment-service/Dockerfile --tag payment-service:ci .
