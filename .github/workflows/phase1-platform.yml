name: Phase 1 Platform Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-platform:
    name: Validate platform foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Sync locked workspace
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run --all-packages ruff check .

      - name: Format check
        run: uv run --all-packages ruff format --check .

      - name: Type check
        run: uv run --all-packages mypy

      - name: Tests
        run: uv run --all-packages pytest

      - name: Validate Compose
        run: docker compose -f infrastructure/compose/docker-compose.yml config

      - name: Build reference service image
        run: docker build --file services/reference-service/Dockerfile --tag reference-service:ci .
