name: Phase 0 Architecture Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: phase0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-architecture:
    name: Validate architecture artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-08-25
        with:
          persist-credentials: false

      - name: Validate Phase 0 structure and contracts
        shell: pwsh
        run: ./scripts/validate_phase0.ps1
