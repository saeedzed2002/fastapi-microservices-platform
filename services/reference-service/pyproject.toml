[project]
name = "reference-service"
version = "0.1.0"
description = "Dependency-light non-domain service used to validate the platform foundation."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "platform-observability",
  "pydantic-settings>=2.15,<3",
  "uvicorn[standard]>=0.52.3,<0.53",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
platform-observability = { workspace = true }
