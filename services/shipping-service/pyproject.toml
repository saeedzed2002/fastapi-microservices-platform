[project]
name = "shipping-service"
version = "0.1.0"
description = "Shipping-owned shipment lifecycle extracted from Order fulfillment."
requires-python = ">=3.14,<3.15"
dependencies = [
  "aiokafka>=0.14,<0.15",
  "alembic>=1.19.1,<2",
  "asyncpg>=0.31,<0.32",
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28.1,<0.29",
  "platform-auth",
  "platform-messaging",
  "platform-observability",
  "pydantic-settings>=2.15,<3",
  "SQLAlchemy[asyncio]>=2.0.52,<2.1",
  "uvicorn[standard]>=0.52.3,<0.53",
]

[project.scripts]
shipping-worker = "shipping_service.workers.runtime_main:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.sources]
platform-auth = { workspace = true }
platform-messaging = { workspace = true }
platform-observability = { workspace = true }
